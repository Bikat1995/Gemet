services:
  - type: web
    name: gemet-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @gemet/api
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run start -w @gemet/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gemet-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gemet-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: API_URL
        sync: false
      - key: TMA_RETURN_URL
        sync: false
      - key: TMA_URL
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false

  - type: redis
    name: gemet-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: gemet-postgres
    databaseName: gemet
    user: gemet
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
