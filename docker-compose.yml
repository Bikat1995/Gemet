services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gemet}
      POSTGRES_DB: gemet
    ports: ["5432:5432"]
    volumes: ["gemet-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    # 6379 is already occupied locally; expose Gemet's isolated Redis on 6380.
    ports: ["6380:6379"]
    command: redis-server --appendonly yes
volumes:
  gemet-postgres:
